<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <rect width="1200" height="650" fill="#ffffff"/>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>
  <text x="600" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#111827">Financial Planning Manager</text>
  <text x="600" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#4b5563">Local ledger → budgets and statements → plans and review</text>

  <g font-family="Arial, sans-serif" font-size="16" text-anchor="middle">
    <rect x="45" y="155" width="155" height="80" rx="14" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
    <text x="122" y="187" fill="#111827">Accounts</text>
    <text x="122" y="212" fill="#4b5563">+ Imports</text>

    <rect x="240" y="155" width="175" height="80" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
    <text x="327" y="187" fill="#111827">Transactions</text>
    <text x="327" y="212" fill="#4b5563">+ Transfers</text>

    <rect x="455" y="155" width="165" height="80" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="537" y="187" fill="#111827">Local Ledger</text>
    <text x="537" y="212" fill="#4b5563">SQLite</text>
  </g>

  <g stroke="#6b7280" stroke-width="3" fill="none">
    <line x1="200" y1="195" x2="240" y2="195"/><polygon points="235,189 245,195 235,201" fill="#6b7280"/>
    <line x1="415" y1="195" x2="455" y2="195"/><polygon points="450,189 460,195 450,201" fill="#6b7280"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="16" text-anchor="middle">
    <rect x="705" y="115" width="190" height="82" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="800" y="148" fill="#111827">Monthly Budgets</text>
    <text x="800" y="173" fill="#4b5563">Plan vs actual</text>

    <rect x="705" y="225" width="190" height="82" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
    <text x="800" y="258" fill="#111827">Statements</text>
    <text x="800" y="283" fill="#4b5563">PL • BS • CF</text>

    <rect x="705" y="335" width="190" height="82" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="800" y="368" fill="#111827">Financial Plans</text>
    <text x="800" y="393" fill="#4b5563">Goals • targets</text>
  </g>

  <g stroke="#6b7280" stroke-width="3" fill="none">
    <path d="M620 195 L660 195 L660 156 L705 156"/><polygon points="700,150 710,156 700,162" fill="#6b7280"/>
    <path d="M620 195 L660 195 L660 266 L705 266"/><polygon points="700,260 710,266 700,272" fill="#6b7280"/>
    <path d="M620 195 L660 195 L660 376 L705 376"/><polygon points="700,370 710,376 700,382" fill="#6b7280"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="16" text-anchor="middle">
    <rect x="965" y="225" width="190" height="82" rx="14" fill="#f9fafb" stroke="#374151" stroke-width="2"/>
    <text x="1060" y="258" fill="#111827">Financial Review</text>
    <text x="1060" y="283" fill="#4b5563">Progress + variance</text>

    <rect x="965" y="335" width="190" height="82" rx="14" fill="#f9fafb" stroke="#374151" stroke-width="2"/>
    <text x="1060" y="368" fill="#111827">Adjust Decisions</text>
    <text x="1060" y="393" fill="#4b5563">Update plans/budgets</text>
  </g>

  <g stroke="#6b7280" stroke-width="3" fill="none">
    <line x1="895" y1="266" x2="965" y2="266" marker-end="url(#arrowhead)"/>
    <line x1="895" y1="348" x2="965" y2="294" marker-end="url(#arrowhead)"/>
    <line x1="1060" y1="307" x2="1060" y2="335" marker-end="url(#arrowhead)"/>
    <line x1="965" y1="376" x2="895" y2="376" marker-end="url(#arrowhead)"/>
  </g>

  <rect x="145" y="500" width="910" height="105" rx="16" fill="#f9fafb" stroke="#d1d5db" stroke-width="2"/>
  <text x="600" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#111827">System principles</text>
  <g font-family="Arial, sans-serif" font-size="15" fill="#374151">
    <text x="195" y="570">• Local-first private storage</text>
    <text x="430" y="570">• Integer minor-unit money</text>
    <text x="665" y="570">• One ledger, multiple views</text>
    <text x="885" y="570">• Traceable calculations</text>
  </g>
</svg>
